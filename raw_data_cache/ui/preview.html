<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ST-预设助手 · UI 与悬浮控制面板预览沙盒</title>
  <style>
    :root {
      --bg-page: #f5eff3;
      --bg-mes: #fcf9fb;
      --SmartThemeBlurTintColor: rgba(252, 249, 251, 0.94);
      --SmartThemeBodyColor: #322930;
      --SmartThemeEmColor: #b85d7e;
      --SmartThemeBorderColor: rgba(130, 82, 104, 0.22);
      --mainFontFamily: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body[data-theme="light"] {
      --bg-page: #f2f4f7;
      --bg-mes: #ffffff;
      --SmartThemeBlurTintColor: rgba(255, 255, 255, 0.95);
      --SmartThemeBodyColor: #26292e;
      --SmartThemeEmColor: #9e476b;
      --SmartThemeBorderColor: rgba(0, 0, 0, 0.14);
    }

    body[data-theme="dark"] {
      --bg-page: #19161b;
      --bg-mes: #231f26;
      --SmartThemeBlurTintColor: rgba(30, 26, 34, 0.95);
      --SmartThemeBodyColor: #e2d8de;
      --SmartThemeEmColor: #df8aa8;
      --SmartThemeBorderColor: rgba(255, 220, 235, 0.14);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--bg-page);
      color: var(--SmartThemeBodyColor);
      font-family: var(--mainFontFamily);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .toolbar, .inspector {
      max-width: 820px;
      margin: 0 auto 16px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--SmartThemeBorderColor);
      background: var(--bg-mes);
      font-size: 13px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .theme-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .theme-btn {
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--SmartThemeBorderColor);
      background: transparent;
      color: var(--SmartThemeBodyColor);
      cursor: pointer;
      font-size: 12px;
    }
    .theme-btn.active {
      background: color-mix(in srgb, var(--SmartThemeEmColor) 20%, transparent);
      border-color: var(--SmartThemeEmColor);
      font-weight: 600;
    }
    .mes {
      max-width: 820px;
      margin: 0 auto 18px;
      padding: 20px 24px;
      border-radius: 10px;
      background: var(--bg-mes);
      border: 1px solid var(--SmartThemeBorderColor);
      line-height: 1.8;
      font-size: 15px;
    }
    .mes-label {
      font-size: 12px;
      opacity: 0.65;
      margin-bottom: 10px;
    }
    .composer {
      max-width: 820px;
      margin: 0 auto 16px;
      padding: 14px;
      border-radius: 10px;
      background: var(--bg-mes);
      border: 1px solid var(--SmartThemeBorderColor);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #send_textarea {
      flex: 1;
      min-height: 58px;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid var(--SmartThemeBorderColor);
      background: transparent;
      color: var(--SmartThemeBodyColor);
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
    }
    #send_but {
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid var(--SmartThemeEmColor);
      background: color-mix(in srgb, var(--SmartThemeEmColor) 22%, transparent);
      color: var(--SmartThemeBodyColor);
      font-weight: 600;
      cursor: pointer;
    }
    #send_log {
      max-width: 820px;
      margin: 0 auto 14px;
      font-size: 12.5px;
      color: var(--SmartThemeEmColor);
      min-height: 18px;
    }
    .inspector pre {
      margin: 8px 0 0;
      padding: 10px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--SmartThemeBodyColor) 5%, transparent);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.55;
      max-height: 220px;
      overflow: auto;
    }
    .error-banner {
      max-width: 820px;
      margin: 0 auto 16px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #c94a4a;
      background: rgba(201, 74, 74, 0.12);
      color: #c94a4a;
      display: none;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span><strong>ST-预设助手 (ST-PresetAssistant) · 单源正则 UI 与悬浮控制面板预览沙盒</strong>（含模拟 TavernHelper 写回与预设切换）</span>
    <div class="theme-btns">
      <button class="theme-btn active" data-t="rosepaper">蔷薇浅纸</button>
      <button class="theme-btn" data-t="light">纯白清爽</button>
      <button class="theme-btn" data-t="dark">暗夜绯紫</button>
    </div>
  </div>

  <div id="error_banner" class="error-banner"></div>

  <div class="mes" mesid="0">
    <div class="mes-label">Mock 消息 #0 · 含 &lt;draft&gt; 干扰隔离 + 两串段间批注（含第三方客人前缀测试） + &lt;options&gt;</div>
    <div id="mes_render_0"></div>
  </div>

  <div class="composer">
    <textarea id="send_textarea" placeholder="点击行动选项测试“填入 / 发送”；或直接在上方批注楼里测试“追加 / 编辑 / 删除”写回消息本体..."></textarea>
    <button id="send_but" type="button">发送 (#send_but)</button>
  </div>
  <div id="send_log"></div>

  <div class="inspector">
    <strong>实时预设开关观测（验证悬浮窗 updatePresetWith('in_use') / replacePreset 联动结果）：</strong>
    <pre id="preset_inspector"></pre>
  </div>

  <div class="inspector">
    <strong>实时消息本体观测（验证 TavernHelper.setChatMessages(..., { refresh: "none" }) 写回结果）：</strong>
    <pre id="raw_inspector"></pre>
  </div>

  <script>
    document.querySelectorAll(".theme-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".theme-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const t = btn.getAttribute("data-t");
        if (t === "rosepaper") document.body.removeAttribute("data-theme");
        else document.body.setAttribute("data-theme", t);
      });
    });

    document.getElementById("send_but").addEventListener("click", () => {
      const ta = document.getElementById("send_textarea");
      document.getElementById("send_log").textContent = "模拟宿主触发发送：" + (ta.value || "(空)");
    });

    const mockMessages = {
      0: `<draft>
1. 节拍推演：酒精灯火光昏暗，精灵老板娘故意把酒杯推近，测试试探张力。
2. 格式与干扰检查：草稿里提及示例，绝不能被外层正则误捕获：
※ 莉莉丝：这段草稿里的示例批注绝不能渲染成楼层卡片
<options>
X. [草稿干扰]：绝不能渲染为选项卡片
</options>
</draft>

酒馆二楼的橡木隔间闷热得紧，壁炉余烬把她的侧脸映出一层暖红的油光。她没有急着接过酒杯，只把袖口往上挽了一截，露出一截沾着酒渍的雪白手腕，指尖慢悠悠地绕着杯沿打转。

※ 莉莉丝：以本魔在梦魔街混了半辈子的经验来看，这种明明想勾人却先慢半拍摩挲杯沿的桥段，最能把客人的耐性吊到嗓子眼——不过节奏稳住，别刚搭话就急着扯衣领。

柜台后的老主顾往这边斜睨了一眼，她倒像是半点没察觉，俯身靠近半寸，嗓音压得又低又哑：“这坛蜜酿存了十二年，烈得很，你确定今晚就要开封？”

※ 莉莉丝：氛围感拉满，台词留白也不错。顺带一提，这十二年陈酿的设定要是真能在后头发挥点催情效用，这稿子就能多拿半颗星。
※ 泠音：伏笔记录：柜台后的老主顾与十二年蜜酿存在旧怨，下轮需留意酒瓶封泥印记。
※ master：这段拉扯感可以，继续往酒劲上推一点
※ 克里姆：作为路过的鉴赏家，我觉得灯光亮度打八分，酒杯反光细节很专业。

<options>
A. [顺势试探]：接过酒杯浅抿一口，指尖故意擦过她的腕骨
B. [反客为主]：把杯子轻轻推回桌面，直视她询问今晚的真正规矩
C. [留余地观察]：靠回椅背慢慢打量这间包厢的隔音与窗栓
</options>`
    };

    const inspectorEl = document.getElementById("raw_inspector");
    const presetInspectorEl = document.getElementById("preset_inspector");
    function updateInspector() {
      inspectorEl.textContent = mockMessages[0];
    }
    updateInspector();

    const mockPresetStore = {
      "ST-预设助手": {
        settings: { should_stream: true, temperature: 1.0 },
        extensions: { tavern_helper: { scripts: [], variables: { st_preset_version: "0.1.0" } } },
        prompts: [
          { id: "yd_persona_lilith", name: "[人设] 莉莉丝", enabled: true },
          { id: "yd_persona_lingyin", name: "[人设] 泠音", enabled: false },
          { id: "custom_uuid_01", name: "[人设] 克里姆", enabled: false },
          { id: "yd_style_erotica", name: "[文风] 情色文学", enabled: true },
          { id: "yd_style_pulp_smut", name: "[文风] 肉文直白", enabled: false },
          { id: "yd_style_slice_of_life", name: "[文风] 写实白描", enabled: false },
          { id: "yd_style_delicate", name: "[文风] 细腻工笔", enabled: false },
          { id: "yd_style_light_novel", name: "[文风] 轻小说体", enabled: false },
          { id: "yd_style_web_brisk", name: "[文风] 轻快网感", enabled: false },
          { id: "yd_style_classical", name: "[文风] 古风雅韵", enabled: false },
          { id: "yd_style_literary_formal", name: "[文风] 典雅书面", enabled: false },
          { id: "yd_pov_1st", name: "[视角] 第一人称", enabled: false },
          { id: "yd_pov_2nd", name: "[视角] 第二人称", enabled: false },
          { id: "yd_pov_3rd_limited", name: "[视角] 第三人称限知", enabled: true },
          { id: "yd_pov_omniscient", name: "[视角] 第三人称全知", enabled: false },
          { id: "yd_pace_slow", name: "[节奏] 慢笔细写", enabled: false },
          { id: "yd_pace_auto", name: "[节奏] 张弛自然", enabled: true },
          { id: "yd_pace_fast", name: "[节奏] 紧凑推进", enabled: false },
          { id: "yd_pace_jump", name: "[节奏] 跳场略写", enabled: false },
          { id: "yd_focus_balance", name: "[侧重] 均衡全面", enabled: true },
          { id: "yd_focus_dialogue", name: "[侧重] 对话交锋", enabled: false },
          { id: "yd_focus_action", name: "[侧重] 动作神态", enabled: false },
          { id: "yd_focus_psychology", name: "[侧重] 心理刻画", enabled: false },
          { id: "yd_focus_environment", name: "[侧重] 环境烘托", enabled: false },
          { id: "yd_nsfw_bias_neutral", name: "[NSFW倾向] 无倾向", enabled: false },
          { id: "yd_nsfw_bias_male", name: "[NSFW倾向] 男性向", enabled: false },
          { id: "yd_nsfw_bias_female", name: "[NSFW倾向] 女性向", enabled: false },
          { id: "yd_nsfw_detail_diversity", name: "[NSFW细化] 反应多样性", enabled: false },
          { id: "yd_length_short", name: "[篇幅] 短篇 (400-800字)", enabled: false },
          { id: "yd_length_medium", name: "[篇幅] 中篇 (800-1200字)", enabled: true },
          { id: "yd_length_long", name: "[篇幅] 长篇 (1200-1800字)", enabled: false },
          { id: "yd_feat_inline_comment", name: "[功能] 段间随记批注", enabled: true },
          { id: "yd_feat_action_options", name: "[功能] 行动选项", enabled: true },
          { id: "yd_feat_anti_repeat", name: "[功能] 剧情防重复", enabled: true },
          { id: "yd_feat_format_compat", name: "[功能] 格式兼容", enabled: true },
          { id: "yd_cot_output_draft", name: "[思考] 输出草稿面板", enabled: true },
          { id: "yd_cot_unified", name: "[思考] 基本推理", enabled: true },
          { id: "yd_prefill_draft", name: "[思考] 预填充草稿 (Prefill)", enabled: false }
        ]
      }
    };
    let inUsePreset = JSON.parse(JSON.stringify(mockPresetStore["ST-预设助手"]));

    function renderPresetInspector() {
      if (!presetInspectorEl) return;
      const enabledNames = inUsePreset.prompts.filter(p => p.enabled).map(p => `[${p.id}] ${p.name}`);
      const themes = (inUsePreset.extensions && inUsePreset.extensions.tavern_helper && inUsePreset.extensions.tavern_helper.variables && inUsePreset.extensions.tavern_helper.variables.yd_persona_themes) || {};
      presetInspectorEl.textContent = "已启用条目 (" + enabledNames.length + "):\n" + enabledNames.join("\n") + "\n\n人设绑定配色:\n" + JSON.stringify(themes, null, 2);
    }
    renderPresetInspector();

    // Expose documented TavernHelper API on window for same-origin iframe verification
    window.TavernHelper = {
      getCurrentMessageId() { return 0; },
      getChatMessages(id) {
        return [{ message_id: Number(id), message: mockMessages[Number(id)] || "" }];
      },
      async setChatMessages(updates, opts) {
        updates.forEach(u => {
          mockMessages[Number(u.message_id)] = u.message;
        });
        updateInspector();
        document.getElementById("send_log").textContent = "TavernHelper.setChatMessages 已写回消息 #" + updates[0].message_id + " (refresh=" + (opts && opts.refresh ? opts.refresh : "affected") + ")";
      },
      getLoadedPresetName() {
        return "ST-预设助手";
      },
      getPreset(name) {
        if (name === "in_use") return JSON.parse(JSON.stringify(inUsePreset));
        return JSON.parse(JSON.stringify(mockPresetStore[name] || inUsePreset));
      },
      async updatePresetWith(name, updater) {
        const target = name === "in_use" ? JSON.parse(JSON.stringify(inUsePreset)) : JSON.parse(JSON.stringify(mockPresetStore[name] || inUsePreset));
        const next = await updater(target) || target;
        if (name === "in_use") inUsePreset = next;
        else mockPresetStore[name] = next;
        renderPresetInspector();
        return next;
      },
      async replacePreset(name, nextPreset) {
        mockPresetStore[name] = JSON.parse(JSON.stringify(nextPreset));
        renderPresetInspector();
      }
    };

    function stripHtmlFence(tpl) {
      return tpl.replace(/^```html\s*\r?\n/i, "").replace(/\r?\n```\s*$/i, "");
    }

    function mountIframes(root, htmlList) {
      root.querySelectorAll("div[data-ll-iframe-idx]").forEach(placeholder => {
        const idx = Number(placeholder.getAttribute("data-ll-iframe-idx"));
        const iframe = document.createElement("iframe");
        iframe.style.width = "100%";
        iframe.style.border = "none";
        iframe.style.display = "block";
        iframe.style.overflow = "hidden";
        iframe.style.height = "150px";
        iframe.srcdoc = htmlList[idx] || "";
        placeholder.replaceWith(iframe);
      });
    }

    async function initPreview() {
      try {
        const [draftTpl, optTplRaw, commentTplRaw] = await Promise.all([
          fetch("./draft_card.html").then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); }),
          fetch("./options_card.html").then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); }),
          fetch("./comment_card.html").then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); })
        ]);

        const optTpl = stripHtmlFence(optTplRaw);
        const commentTpl = stripHtmlFence(commentTplRaw);

        const draftRegex = /<draft\b[^>]*>([\s\S]*?)<\/draft>|```draft[ \t]*\r?\n([\s\S]*?)\r?\n```(?=[ \t]*(?:\r?\n|$))/gi;
        const commentRegex = /(?<=^|\n)([ \t]*※[ \t]*[^：\r\n:]{1,24}[：:][^\r\n]*(?:\r?\n[ \t]*※[ \t]*[^：\r\n:]{1,24}[：:][^\r\n]*)*)(?!(?:(?!<draft\b|<details\b[^>]*class="yd-draft-box")[\s\S])*(?:<\/draft>|<\/details>\s*<style>\.yd-draft-box))(?=[ \t]*(?:\r?\n|$))/gi;
        const optRegex = /(?<=^|\n)[ \t]*<options\b[^>]*>\s*([^<]*(?:<(?!\/?(?:draft|details|div|options)\b)[^<]*)*)<\/options>(?![\s\S]*(?:<\/draft>|<\/details>\s*<style>\.yd-draft-box))(?=[ \t]*(?:\r?\n|$))/gi;

        const htmlList = [];
        let out = mockMessages[0].replace(draftRegex, (_, g1, g2) =>
          draftTpl.replace("$1$2", () => (g1 || g2 || "").trim())
        );
        out = out.replace(commentRegex, (_, g1) => {
          const idx = htmlList.length;
          htmlList.push(commentTpl.replace("$1", () => (g1 || "").trim()));
          return `<div data-ll-iframe-idx="${idx}"></div>`;
        });
        out = out.replace(optRegex, (_, g1) => {
          const idx = htmlList.length;
          htmlList.push(optTpl.replace("$1", () => (g1 || "").trim()));
          return `<div data-ll-iframe-idx="${idx}"></div>`;
        });

        const container = document.getElementById("mes_render_0");
        container.innerHTML = out.replace(/\n\n/g, "<br><br>");
        mountIframes(container, htmlList);
      } catch (err) {
        const banner = document.getElementById("error_banner");
        banner.style.display = "block";
        banner.textContent = "无法加载单源 UI 模板：" + err.message;
      }
    }

    initPreview();

    // Sandbox Mock for single initial update check (supports ?mock_update=0.2.0)
    const mockParams = new URLSearchParams(window.location.search);
    const mockRemoteVer = mockParams.get("mock_update") || "0.1.0";
    window.__YD_FETCH_CALL_COUNT__ = 0;
    window.__YD_TEST_FETCH__ = async function () {
      window.__YD_FETCH_CALL_COUNT__ += 1;
      return {
        ok: true,
        async json() {
          return { version: mockRemoteVer };
        }
      };
    };
  </script>
  <script src="./floating_panel.js"></script>
</body>
</html>
