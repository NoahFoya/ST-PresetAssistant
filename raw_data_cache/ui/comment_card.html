<div class="yd-talk-card is-collapsed" id="yd-talk-card" data-yd-card="comment">

        <button type="button" class="yd-role-toggle" id="yd-role-toggle" aria-label="展开或收起署名候选" aria-expanded="false" title="选择历史记忆署名">▾</button>
      </div>
      <input type="text" class="yd-reply-input" id="yd-reply-input" placeholder="追加点评或正文批注（全楼层支持直接编辑改写）..." />
      <button type="button" class="yd-reply-btn" id="yd-reply-btn">追加</button>
    </div>
    <div class="yd-role-menu" id="yd-role-menu" hidden></div>
    <div class="yd-talk-toast" id="yd-talk-toast"></div>
  </div>
  <textarea id="yd-talk-raw" style="display:none;" readonly>$1</textarea>
</div>
<script>
(function () {
  function getHostWin() {
    try {
      if (window.parent && window.parent !== window && window.parent.document) {
        return window.parent;
      }
    } catch (e) {}
    return window;
  }

  function getHostDoc() {
    const hw = getHostWin();
    return hw && hw.document ? hw.document : document;
  }

  function syncHostTheme() {
    try {
      const hw = getHostWin();
      const hd = hw.document;
      if (hd === document) return;
      const rootStyle = hw.getComputedStyle(hd.documentElement);
      const bodyStyle = hd.body ? hw.getComputedStyle(hd.body) : rootStyle;
      ["--SmartThemeBodyColor", "--SmartThemeEmColor", "--SmartThemeBorderColor", "--mainFontFamily"].forEach(function (name) {
        const val = bodyStyle.getPropertyValue(name).trim() || rootStyle.getPropertyValue(name).trim();
        if (val) document.documentElement.style.setProperty(name, val);
      });
      if (!bodyStyle.getPropertyValue("--SmartThemeBodyColor").trim() && !rootStyle.getPropertyValue("--SmartThemeBodyColor").trim() && bodyStyle.color) {
        document.documentElement.style.setProperty("--SmartThemeBodyColor", bodyStyle.color);
      }
      if (!bodyStyle.getPropertyValue("--mainFontFamily").trim() && !rootStyle.getPropertyValue("--mainFontFamily").trim() && bodyStyle.fontFamily) {
        document.documentElement.style.setProperty("--mainFontFamily", bodyStyle.fontFamily);
      }
    } catch (e) {}
  }

  const cardEl = document.getElementById("yd-talk-card");
  const headEl = document.getElementById("yd-talk-head");
  const rawEl = document.getElementById("yd-talk-raw");
  const listEl = document.getElementById("yd-floor-list");
  const countEl = document.getElementById("yd-talk-count");
  const previewEl = document.getElementById("yd-talk-preview");
  const collapseBtn = document.getElementById("yd-collapse-btn");
  const replyInput = document.getElementById("yd-reply-input");
  const roleWrap = document.getElementById("yd-role-wrap");
  const replyRoleInput = document.getElementById("yd-reply-role");
  const roleToggleBtn = document.getElementById("yd-role-toggle");
  const roleMenuEl = document.getElementById("yd-role-menu");
  const replyBtn = document.getElementById("yd-reply-btn");
  const toastEl = document.getElementById("yd-talk-toast");

  const LAST_SPEAKER_KEY = "yd_assistant_comment_last_speaker_v1";
  const CUSTOM_SPEAKERS_KEY = "yd_assistant_comment_custom_speakers_v1";
  const MAX_CUSTOM_SPEAKERS = 8;
  let lastSavedSpeaker = null;
  let roleMenuOpen = false;

  function getHostStorage() {
    try {
      const hw = getHostWin();
      if (hw && hw.localStorage) return hw.localStorage;
    } catch (e) {}
    try {
      if (window.localStorage) return window.localStorage;
    } catch (e) {}
    return null;
  }

  function sanitizeSpeaker(raw) {
    return String(raw || "")
      .replace(/[:：\r\n]+/g, "")
      .trim()
      .slice(0, 24);
  }

  function loadLastSpeaker() {
    try {
      const st = getHostStorage();
      const clean = st ? sanitizeSpeaker(st.getItem(LAST_SPEAKER_KEY)) : "";
      if (clean) return clean;
    } catch (e) {}
    return "master";
  }

  function saveLastSpeaker(name) {
    const clean = sanitizeSpeaker(name);
    if (!clean || clean === lastSavedSpeaker) return;
    lastSavedSpeaker = clean;
    try {
      const st = getHostStorage();
      if (st) st.setItem(LAST_SPEAKER_KEY, clean);
    } catch (e) {}
  }

  function loadCustomSpeakers() {
    try {
      const st = getHostStorage();
      const raw = st ? st.getItem(CUSTOM_SPEAKERS_KEY) : null;
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          const out = [];
          arr.forEach(function (item) {
            const clean = sanitizeSpeaker(item);
            if (clean && out.indexOf(clean) === -1) out.push(clean);
          });
          return out.slice(0, MAX_CUSTOM_SPEAKERS);
        }
      }
    } catch (e) {}
    return [];
  }

  function saveCustomSpeakersList(list) {
    try {
      const st = getHostStorage();
      if (st) st.setItem(CUSTOM_SPEAKERS_KEY, JSON.stringify(list.slice(0, MAX_CUSTOM_SPEAKERS)));
    } catch (e) {}
  }

  function rememberCustomSpeaker(name, authorSet) {
    const clean = sanitizeSpeaker(name);
    if (!clean) return;
    const low = clean.toLowerCase();
    if (low === "master" || clean === "读者" || clean === "批注") return;
    if (authorSet && authorSet[low]) return;
    const prev = loadCustomSpeakers().filter(function (item) {
      return item.toLowerCase() !== low;
    });
    prev.unshift(clean);
    saveCustomSpeakersList(prev);
  }

  function removeCustomSpeaker(name) {
    const clean = sanitizeSpeaker(name);
    if (!clean) return;
    const low = clean.toLowerCase();
    const next = loadCustomSpeakers().filter(function (item) {
      return item.toLowerCase() !== low;
    });
    saveCustomSpeakersList(next);
    if (replyRoleInput && sanitizeSpeaker(replyRoleInput.value).toLowerCase() === low) {
      replyRoleInput.value = "master";
      saveLastSpeaker("master");
    }
    renderRoleMenu();
    render();
  }

  function setRoleMenuOpen(open) {
    roleMenuOpen = Boolean(open);
    if (roleWrap) roleWrap.classList.toggle("is-open", roleMenuOpen);
    if (roleToggleBtn) roleToggleBtn.setAttribute("aria-expanded", String(roleMenuOpen));
    if (roleMenuEl) roleMenuEl.hidden = !roleMenuOpen;
    if (roleMenuOpen) renderRoleMenu();
    notifyFrameResize();
  }

  function renderRoleMenu() {
    if (!roleMenuEl) return;
    roleMenuEl.innerHTML = "";
    const labelEl = document.createElement("span");
    labelEl.className = "yd-role-menu-label";
    labelEl.textContent = "署名：";
    roleMenuEl.appendChild(labelEl);

    const currentLow = sanitizeSpeaker(replyRoleInput && replyRoleInput.value).toLowerCase();
    const items = [
      { value: "master", text: "master", removable: false },
      { value: "批注", text: "正文批注", removable: false },
    ];
    loadCustomSpeakers().forEach(function (name) {
      items.push({ value: name, text: name, removable: true });
    });

    items.forEach(function (item) {
      const chip = document.createElement("span");
      const active = currentLow === item.value.toLowerCase();
      chip.className = "yd-role-chip" + (active ? " is-active" : "");

      const pickBtn = document.createElement("button");
      pickBtn.type = "button";
      pickBtn.className = "yd-role-chip-pick";
      pickBtn.textContent = item.text;
      pickBtn.title = "选用署名：" + item.value;
      pickBtn.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
      pickBtn.addEventListener("click", function () {
        if (replyRoleInput) replyRoleInput.value = item.value;
        saveLastSpeaker(item.value);
        setRoleMenuOpen(false);
        if (replyInput) replyInput.focus();
      });
      chip.appendChild(pickBtn);

      if (item.removable) {
        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "yd-role-chip-del";
        delBtn.textContent = "×";
        delBtn.title = "从记忆中移除 " + item.value;
        delBtn.setAttribute("aria-label", "移除记忆署名 " + item.value);
        delBtn.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
        delBtn.addEventListener("click", function (ev) {
          ev.stopPropagation();
          removeCustomSpeaker(item.value);
        });
        chip.appendChild(delBtn);
      }

      roleMenuEl.appendChild(chip);
    });
  }

  function notifyFrameResize() {
    try {
      if (window.frameElement && window.parent && window.parent !== window) {
        const target = cardEl || document.body;
        const h = target ? Math.ceil(target.getBoundingClientRect().height) + 8 : document.documentElement.scrollHeight;
        window.frameElement.style.height = Math.max(h, 36) + "px";
      }
    } catch (e) {}
  }

  syncHostTheme();
  try {
    const hd = getHostDoc();
    if (hd !== document && typeof MutationObserver !== "undefined" && hd.body) {
      new MutationObserver(syncHostTheme).observe(hd.body, { attributes: true, attributeFilter: ["data-theme", "class", "style"] });
      new MutationObserver(syncHostTheme).observe(hd.documentElement, { attributes: true, attributeFilter: ["data-theme", "class", "style"] });
    }
  } catch (e) {}

  let toastTimer = null;
  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    notifyFrameResize();
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
      notifyFrameResize();
    }, 2600);
  }

  function htmlToPlainText(raw) {
    const str = String(raw || "");
    if (!/<(?:br|\/(?:p|div|li))>/i.test(str)) return str;
    const norm = str.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li)>/gi, "\n");
    try {
      if (typeof DOMParser !== "undefined") {
        const doc = new DOMParser().parseFromString(norm, "text/html");
        if (doc && doc.body) return doc.body.textContent || "";
      }
    } catch (e) {}
    return norm.replace(/<[^>]+>/g, "");
  }

  let initialRaw = "";
  if (rawEl) {
    initialRaw = htmlToPlainText(typeof rawEl.value === "string" ? rawEl.value : (rawEl.textContent || ""));
  }

  let currentBlockText = initialRaw.trim();
  let editingFloorIdx = -1;
  let isWriting = false;

  function parseFloors(blockText) {
    const lines = blockText.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    const floors = [];
    const lineRe = /^※\s*([^：\r\n:]{1,24})[：:]\s*(.*)$/;
    lines.forEach(function (line) {
      const m = line.match(lineRe);
      if (m) {
        floors.push({ speaker: m[1].trim(), text: m[2].trim() });
      } else if (floors.length > 0) {
        floors[floors.length - 1].text += "\n" + line;
      } else {
        floors.push({ speaker: "批注", text: line.replace(/^※\s*/, "") });
      }
    });
    return floors;
  }

  function serializeFloors(floors) {
    return floors.map(function (f) {
      const cleanBody = String(f.text || "").replace(/\r?\n+/g, " ").trim();
      return "※ " + f.speaker + "：" + cleanBody;
    }).join("\n");
  }

  function collectAuthorPersonas() {
    const map = { "莉莉丝": true, "lilith": true, "泠音": true, "lingyin": true };
    try {
      const hw = getHostWin();
      const th = window.TavernHelper || (hw && hw.TavernHelper) || null;
      const getPreset = window.getPreset || (th && th.getPreset) || (hw && hw.getPreset) || null;
      const preset = getPreset ? getPreset("in_use") : null;
      const prompts = (preset && preset.prompts) || [];
      prompts.forEach(function (p) {
        if (!p || p.marker) return;
        const m = String(p.name || "").trim().match(/^\[AI人设\]\s*(.+?)\s*\[(单选|多选)\]/);
        if (m && m[1]) {
          const pName = sanitizeSpeaker(m[1]);
          if (pName) map[pName.toLowerCase()] = true;
        }
      });
    } catch (e) {}
    return map;
  }

  function buildRoleContext() {
    const readerMap = { "master": true, "读者": true };
    loadCustomSpeakers().forEach(function (n) {
      readerMap[n.toLowerCase()] = true;
    });
    return {
      authors: collectAuthorPersonas(),
      readers: readerMap,
    };
  }

  function getRoleMeta(speaker, roleCtx) {
    const s = String(speaker || "").trim();
    const low = s.toLowerCase();
    const ctx = roleCtx || buildRoleContext();
    if (ctx.authors[low]) {
      return { cls: "is-author", badge: "作者", avatar: (s.charAt(0) || "作").toUpperCase() };
    }
    if (s === "批注") {
      return { cls: "is-author", badge: "批注", avatar: s.charAt(0) };
    }
    if (ctx.readers[low]) {
      return { cls: "is-master", badge: "读者", avatar: low === "master" ? "M" : (s.charAt(0) || "读").toUpperCase() };
    }
    return { cls: "is-guest", badge: "客评", avatar: (s.charAt(0) || "?").toUpperCase() };
  }

  function resolveTavernAdapter() {
    const hw = getHostWin();
    const th = window.TavernHelper || (hw && hw.TavernHelper) || null;
    const getChatMessages = window.getChatMessages || (th && th.getChatMessages) || (hw && hw.getChatMessages) || null;
    const setChatMessages = window.setChatMessages || (th && th.setChatMessages) || (hw && hw.setChatMessages) || null;
    const getCurrentMessageId = window.getCurrentMessageId || (th && th.getCurrentMessageId) || (hw && hw.getCurrentMessageId) || null;
    if (!getChatMessages || !setChatMessages) return null;
    return { getChatMessages: getChatMessages, setChatMessages: setChatMessages, getCurrentMessageId: getCurrentMessageId };
  }

  function detectMessageContext() {
    let mesId = null;
    let blockIdx = 0;
    const adapter = resolveTavernAdapter();
    try {
      if (adapter && adapter.getCurrentMessageId) {
        const cid = adapter.getCurrentMessageId();
        if (typeof cid === "number" && cid >= 0) mesId = cid;
        else if (typeof cid === "string" && /^\d+$/.test(cid)) mesId = Number(cid);
      }
    } catch (e) {}

    try {
      if (window.frameElement) {
        const mesEl = window.frameElement.closest("[mesid]");
        if (mesEl) {
          if (mesId === null) {
            const rawAttr = mesEl.getAttribute("mesid");
            if (rawAttr !== null && /^\d+$/.test(rawAttr)) mesId = Number(rawAttr);
          }
          const frames = Array.prototype.slice.call(mesEl.querySelectorAll("iframe"));
          let commentCount = 0;
          for (let i = 0; i < frames.length; i++) {
            const fr = frames[i];
            if (fr === window.frameElement) {
              blockIdx = commentCount;
              break;
            }
            let isCommentCard = false;
            let isDeletedCard = false;
            try {
              if (fr.contentDocument) {
                if (fr.contentDocument.querySelector('[data-yd-card="comment-deleted"]')) {
                  isDeletedCard = true;
                } else if (fr.contentDocument.querySelector('[data-yd-card="comment"]')) {
                  isCommentCard = true;
                }
              }
            } catch (e) {}
            if (!isCommentCard && !isDeletedCard) {
              try {
                const rawDoc = fr.getAttribute("srcdoc") || fr.srcdoc || "";
                if (rawDoc.indexOf('data-yd-card="comment"') !== -1) {
                  isCommentCard = true;
                }
              } catch (e) {}
            }
            if (isCommentCard) {
              commentCount++;
            }
          }
        }
      }
    } catch (e) {}

    return { mesId: mesId, blockIdx: blockIdx, adapter: adapter };
  }

  function maskThinkBlocks(text) {
    return text.replace(/<draft(?=[\s>])[^>]*>[\s\S]*?<\/draft>/gi, function (m) {
      return m.replace(/[^\r\n]/g, " ");
    });
  }

  function findCommentBlocksInMessage(msgText) {
    const masked = maskThinkBlocks(msgText);
    const re = /(?:^|\n)([ \t]*※[ \t]*[^：\r\n:]{1,24}[：:][^\r\n]*(?:\r?\n[ \t]*※[ \t]*[^：\r\n:]{1,24}[：:][^\r\n]*)*)(?=[ \t]*(?:\r?\n|$))/g;
    const ranges = [];
    let match;
    while ((match = re.exec(masked)) !== null) {
      const fullStart = match.index + (match[0].startsWith("\n") ? 1 : 0);
      const blockStr = match[1];
      ranges.push({ start: fullStart, end: fullStart + blockStr.length, raw: msgText.slice(fullStart, fullStart + blockStr.length) });
    }
    return ranges;
  }

  function resolveTargetCommentRange(ranges, blockIdx, wantedText) {
    const direct = ranges[blockIdx] || null;
    const wanted = String(wantedText || "").trim();
    if (direct && direct.raw.trim() === wanted) {
      return direct;
    }
    const matches = ranges.filter(function (item) {
      return item.raw.trim() === wanted;
    });
    if (matches.length === 1) {
      return matches[0];
    }
    if (matches.length > 1) {
      throw new Error("存在多个相同批注块且索引失配，请刷新消息后重试");
    }
    throw new Error("未能定位当前批注串在消息中的位置");
  }

  async function persistBlockUpdate(nextBlockText, okMsg, onSuccess) {
    const hw = getHostWin();
    if (isWriting || (hw && hw.__YD_COMMENT_WRITE_LOCK__)) return false;
    isWriting = true;
    if (hw) hw.__YD_COMMENT_WRITE_LOCK__ = true;
    if (replyBtn) replyBtn.disabled = true;
    if (replyInput) replyInput.disabled = true;
    if (replyRoleInput) replyRoleInput.disabled = true;
    if (roleToggleBtn) roleToggleBtn.disabled = true;
    setRoleMenuOpen(false);

    try {
      const ctx = detectMessageContext();
      if (!ctx.adapter || ctx.mesId === null) {
        currentBlockText = nextBlockText;
        editingFloorIdx = -1;
        if (onSuccess) onSuccess();
        render();
        showToast(okMsg + "（离线沙盒模式：仅本地暂存）");
        return true;
      }

      const list = await ctx.adapter.getChatMessages(ctx.mesId);
      const msgObj = Array.isArray(list) ? list[0] : null;
      if (!msgObj || typeof msgObj.message !== "string") {
        throw new Error("未读取到当前消息正文");
      }

      const ranges = findCommentBlocksInMessage(msgObj.message);
      const targetRange = resolveTargetCommentRange(ranges, ctx.blockIdx, currentBlockText);

      const before = msgObj.message.slice(0, targetRange.start);
      const after = msgObj.message.slice(targetRange.end);
      let updatedMsg = before + nextBlockText + after;
      if (!nextBlockText) {
        updatedMsg = before.replace(/(?:\r?\n){2,}$/, "\n") + after.replace(/^(?:\r?\n){2,}/, "\n");
      }

      await ctx.adapter.setChatMessages([{ message_id: ctx.mesId, message: updatedMsg }], { refresh: "none" });
      currentBlockText = nextBlockText;
      editingFloorIdx = -1;
      if (onSuccess) onSuccess();
      render();
      showToast(okMsg);
      return true;
    } catch (err) {
      showToast("⚠️ 写回失败：" + (err && err.message ? err.message : String(err)));
      return false;
    } finally {
      isWriting = false;
      if (hw) hw.__YD_COMMENT_WRITE_LOCK__ = false;
      if (replyBtn) replyBtn.disabled = false;
      if (replyInput) replyInput.disabled = false;
      if (replyRoleInput) replyRoleInput.disabled = false;
      if (roleToggleBtn) roleToggleBtn.disabled = false;
    }
  }

  function render() {
    const floors = parseFloors(currentBlockText);
    const isDeleted = !currentBlockText || floors.length === 0;
    if (cardEl) {
      cardEl.setAttribute("data-yd-card", isDeleted ? "comment-deleted" : "comment");
      cardEl.classList.toggle("is-empty", isDeleted);
    }
    if (countEl) countEl.textContent = isDeleted ? "已清空" : (floors.length + " 楼");
    if (previewEl) {
      previewEl.textContent = isDeleted ? "该批注串已清空" : (floors[0].speaker + "：" + floors[0].text);
    }

    listEl.innerHTML = "";
    if (isDeleted) {
      const note = document.createElement("div");
      note.className = "yd-empty-note";
      note.textContent = "该批注串已清空，刷新消息后自动移除";
      listEl.appendChild(note);
      notifyFrameResize();
      return;
    }
    const roleCtx = buildRoleContext();
    floors.forEach(function (floor, idx) {
      const roleMeta = getRoleMeta(floor.speaker, roleCtx);

      const row = document.createElement("div");
      row.className = "yd-floor " + roleMeta.cls;

      const meta = document.createElement("div");
      meta.className = "yd-floor-meta";

      const avatar = document.createElement("span");
      avatar.className = "yd-avatar";
      avatar.textContent = roleMeta.avatar;
      meta.appendChild(avatar);

      const speaker = document.createElement("span");
      speaker.className = "yd-speaker";
      speaker.textContent = floor.speaker;
      meta.appendChild(speaker);

      const badge = document.createElement("span");
      badge.className = "yd-badge";
      badge.textContent = roleMeta.badge;
      meta.appendChild(badge);

      const num = document.createElement("span");
      num.className = "yd-floor-num";
      num.textContent = "#" + (idx + 1);
      meta.appendChild(num);

      const actions = document.createElement("div");
      actions.className = "yd-floor-actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "yd-mini-btn";
      editBtn.textContent = "编辑";
      editBtn.addEventListener("click", function () {
        editingFloorIdx = editingFloorIdx === idx ? -1 : idx;
        render();
      });
      actions.appendChild(editBtn);

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "yd-mini-btn is-danger";
      delBtn.textContent = "删除";
      delBtn.addEventListener("click", function () {
        const nextFloors = floors.filter(function (_, j) { return j !== idx; });
        persistBlockUpdate(serializeFloors(nextFloors), "🗑️ 已删除该条记录");
      });
      actions.appendChild(delBtn);

      meta.appendChild(actions);

      row.appendChild(meta);

      if (editingFloorIdx === idx) {
        const editBox = document.createElement("div");
        editBox.className = "yd-edit-box";

        const editInput = document.createElement("textarea");
        editInput.className = "yd-edit-input";
        editInput.value = floor.text;
        editInput.placeholder = "修改批注内容（回车保存，Esc 取消）";
        editBox.appendChild(editInput);

        function saveEditedFloor() {
          const val = editInput.value.trim();
          if (!val) {
            showToast("⚠️ 点评内容不能为空，如需移除请点删除");
            return;
          }
          const nextFloors = floors.map(function (item, j) {
            return j === idx ? { speaker: item.speaker, text: val } : item;
          });
          persistBlockUpdate(serializeFloors(nextFloors), "✅ 已保存修改");
        }

        editInput.addEventListener("keydown", function (ev) {
          if (ev.isComposing) return;
          if (ev.key === "Enter" && !ev.shiftKey) {
            ev.preventDefault();
            saveEditedFloor();
          } else if (ev.key === "Escape") {
            ev.preventDefault();
            editingFloorIdx = -1;
            render();
          }
        });

        const editBar = document.createElement("div");
        editBar.className = "yd-edit-bar";

        const saveBtn = document.createElement("button");
        saveBtn.type = "button";
        saveBtn.className = "yd-mini-btn";
        saveBtn.textContent = "保存";
        saveBtn.addEventListener("click", saveEditedFloor);
        editBar.appendChild(saveBtn);

        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "yd-mini-btn";
        cancelBtn.textContent = "取消";
        cancelBtn.addEventListener("click", function () {
          editingFloorIdx = -1;
          render();
        });
        editBar.appendChild(cancelBtn);

        editBox.appendChild(editBar);
        row.appendChild(editBox);
      } else {
        const textEl = document.createElement("div");
        textEl.className = "yd-floor-text";
        textEl.textContent = floor.text;
        row.appendChild(textEl);
      }

      listEl.appendChild(row);
    });

    notifyFrameResize();
  }

  function handleAppend() {
    if (!currentBlockText) {
      showToast("⚠️ 该批注串已清空，请刷新消息后再试");
      return;
    }
    const val = replyInput ? replyInput.value.replace(/\r?\n+/g, " ").trim() : "";
    if (!val) {
      showToast("⚠️ 请输入内容后再追加");
      return;
    }
    const speakerTag = sanitizeSpeaker(replyRoleInput && replyRoleInput.value) || "master";
    if (replyRoleInput) replyRoleInput.value = speakerTag;
    const floors = parseFloors(currentBlockText);
    floors.push({ speaker: speakerTag, text: val });
    persistBlockUpdate(serializeFloors(floors), "💬 已追加 " + speakerTag + " 记录", function () {
      saveLastSpeaker(speakerTag);
      rememberCustomSpeaker(speakerTag, collectAuthorPersonas());
      if (roleMenuOpen) renderRoleMenu();
      if (replyInput) replyInput.value = "";
    });
  }

  if (replyRoleInput) {
    replyRoleInput.value = loadLastSpeaker();
    replyRoleInput.addEventListener("focus", function () {
      setRoleMenuOpen(true);
    });
    replyRoleInput.addEventListener("input", function () {
      if (roleMenuOpen) renderRoleMenu();
    });
    replyRoleInput.addEventListener("blur", function () {
      const clean = sanitizeSpeaker(replyRoleInput.value) || "master";
      replyRoleInput.value = clean;
      saveLastSpeaker(clean);
    });
    replyRoleInput.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        setRoleMenuOpen(false);
      } else if (e.key === "Enter") {
        e.preventDefault();
        const clean = sanitizeSpeaker(replyRoleInput.value) || "master";
        replyRoleInput.value = clean;
        saveLastSpeaker(clean);
        setRoleMenuOpen(false);
        if (replyInput) replyInput.focus();
      }
    });
  }

  if (roleToggleBtn) {
    roleToggleBtn.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
    roleToggleBtn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      setRoleMenuOpen(!roleMenuOpen);
    });
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!roleMenuOpen) return;
    if (roleWrap && roleWrap.contains(ev.target)) return;
    if (roleMenuEl && roleMenuEl.contains(ev.target)) return;
    setRoleMenuOpen(false);
  });

  if (replyBtn) {
    replyBtn.addEventListener("click", handleAppend);
  }
  if (replyInput) {
    replyInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleAppend();
      }
    });
  }

  function toggleCollapse() {
    if (!cardEl || !collapseBtn) return;
    const collapsed = cardEl.classList.toggle("is-collapsed");
    if (collapsed && roleMenuOpen) setRoleMenuOpen(false);
    collapseBtn.textContent = collapsed ? "▸" : "▾";
    collapseBtn.setAttribute("aria-expanded", String(!collapsed));
    notifyFrameResize();
  }

  if (collapseBtn && cardEl) {
    collapseBtn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      toggleCollapse();
    });
  }
  if (headEl && cardEl) {
    headEl.addEventListener("click", toggleCollapse);
  }

  render();

  if (typeof ResizeObserver !== "undefined" && (cardEl || document.body)) {
    new ResizeObserver(notifyFrameResize).observe(cardEl || document.body);
  }
})();
</script>
