<div class="yd-talk-card is-collapsed" id="yd-talk-card" data-yd-card="comment">
  <div class="yd-talk-head" id="yd-talk-head">

    </div>
    <button type="button" class="yd-collapse-btn" id="yd-collapse-btn" aria-expanded="false" title="展开 / 收起">▸</button>
  </div>
  <div class="yd-talk-body" id="yd-talk-body">
    <div class="yd-floor-list" id="yd-floor-list"></div>
    <div class="yd-reply-wrap" id="yd-reply-wrap">
      <div class="yd-tag-row" id="yd-tag-row">
        <span class="yd-tag-label">标签</span>
        <button type="button" class="yd-tag-chip is-active" data-yd-tag="点评">点评</button>
        <button type="button" class="yd-tag-chip" data-yd-tag="伏笔">伏笔</button>
        <button type="button" class="yd-tag-chip" data-yd-tag="吐槽">吐槽</button>
        <button type="button" class="yd-tag-chip" data-yd-tag="笔记">笔记</button>
        <input type="text" class="yd-tag-input" id="yd-tag-input" maxlength="12" value="点评" placeholder="自定义标签" aria-label="批注标签" />
      </div>
      <div class="yd-reply-bar">
        <input type="text" class="yd-reply-input" id="yd-reply-input" placeholder="输入批注内容（将按所选标签写入 ※ 标签：...）..." />
        <button type="button" class="yd-reply-btn" id="yd-reply-btn">添加</button>
      </div>
    </div>
    <div class="yd-talk-toast" id="yd-talk-toast"></div>
  </div>
  <textarea id="yd-talk-raw" style="display:none;" readonly>$1</textarea>
</div>
<script>
(function () {
  function getHostWin() {
    try {
      if (window.parent && window.parent !== window && window.parent.document) {
        return window.parent;
      }
    } catch (e) {}
    return window;
  }

  function getHostDoc() {
    const hw = getHostWin();
    return hw && hw.document ? hw.document : document;
  }

  function syncHostTheme() {
    try {
      const hw = getHostWin();
      const hd = hw.document;
      if (hd === document) return;
      const rootStyle = hw.getComputedStyle(hd.documentElement);
      const bodyStyle = hd.body ? hw.getComputedStyle(hd.body) : rootStyle;
      ["--SmartThemeBodyColor", "--SmartThemeEmColor", "--SmartThemeBorderColor", "--mainFontFamily"].forEach(function (name) {
        const val = bodyStyle.getPropertyValue(name).trim() || rootStyle.getPropertyValue(name).trim();
        if (val) document.documentElement.style.setProperty(name, val);
      });
      if (!bodyStyle.getPropertyValue("--SmartThemeBodyColor").trim() && !rootStyle.getPropertyValue("--SmartThemeBodyColor").trim() && bodyStyle.color) {
        document.documentElement.style.setProperty("--SmartThemeBodyColor", bodyStyle.color);
      }
      if (!bodyStyle.getPropertyValue("--mainFontFamily").trim() && !rootStyle.getPropertyValue("--mainFontFamily").trim() && bodyStyle.fontFamily) {
        document.documentElement.style.setProperty("--mainFontFamily", bodyStyle.fontFamily);
      }
    } catch (e) {}
  }

  const QUICK_TAGS = ["点评", "伏笔", "吐槽", "笔记"];
  const cardEl = document.getElementById("yd-talk-card");
  const headEl = document.getElementById("yd-talk-head");
  const rawEl = document.getElementById("yd-talk-raw");
  const listEl = document.getElementById("yd-floor-list");
  const countEl = document.getElementById("yd-talk-count");
  const previewEl = document.getElementById("yd-talk-preview");
  const collapseBtn = document.getElementById("yd-collapse-btn");
  const tagRowEl = document.getElementById("yd-tag-row");
  const tagInput = document.getElementById("yd-tag-input");
  const replyInput = document.getElementById("yd-reply-input");
  const replyBtn = document.getElementById("yd-reply-btn");
  const toastEl = document.getElementById("yd-talk-toast");

  function sanitizeTag(raw) {
    return String(raw || "")
      .replace(/[:：\r\n，。！？；、“”‘’「」『』()（）]+/g, "")
      .trim()
      .slice(0, 12);
  }

  function syncQuickChipState(containerEl, activeTag) {
    if (!containerEl) return;
    const clean = sanitizeTag(activeTag);
    const chips = containerEl.querySelectorAll(".yd-tag-chip");
    for (let i = 0; i < chips.length; i++) {
      const chipTag = chips[i].getAttribute("data-yd-tag") || "";
      chips[i].classList.toggle("is-active", clean !== "" && chipTag === clean);
    }
  }

  function bindTagSelector(rowEl, inputEl) {
    if (!rowEl || !inputEl) return;
    const chips = rowEl.querySelectorAll(".yd-tag-chip");
    for (let i = 0; i < chips.length; i++) {
      chips[i].addEventListener("click", function () {
        const chosen = this.getAttribute("data-yd-tag") || "点评";
        inputEl.value = chosen;
        syncQuickChipState(rowEl, chosen);
      });
    }
    inputEl.addEventListener("input", function () {
      syncQuickChipState(rowEl, inputEl.value);
    });
  }

  function notifyFrameResize() {
    try {
      if (window.frameElement && window.parent && window.parent !== window) {
        const target = cardEl || document.body;
        const h = target ? Math.ceil(target.getBoundingClientRect().height) + 8 : document.documentElement.scrollHeight;
        window.frameElement.style.height = Math.max(h, 36) + "px";
      }
    } catch (e) {}
  }

  syncHostTheme();
  try {
    const hd = getHostDoc();
    if (hd !== document && typeof MutationObserver !== "undefined" && hd.body) {
      new MutationObserver(syncHostTheme).observe(hd.body, { attributes: true, attributeFilter: ["data-theme", "class", "style"] });
      new MutationObserver(syncHostTheme).observe(hd.documentElement, { attributes: true, attributeFilter: ["data-theme", "class", "style"] });
    }
  } catch (e) {}

  let toastTimer = null;
  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    notifyFrameResize();
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
      notifyFrameResize();
    }, 2600);
  }

  function htmlToPlainText(raw) {
    const str = String(raw || "");
    if (!/<(?:br|\/(?:p|div|li))>/i.test(str)) return str;
    const norm = str.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li)>/gi, "\n");
    try {
      if (typeof DOMParser !== "undefined") {
        const doc = new DOMParser().parseFromString(norm, "text/html");
        if (doc && doc.body) return doc.body.textContent || "";
      }
    } catch (e) {}
    return norm.replace(/<[^>]+>/g, "");
  }

  let initialRaw = "";
  if (rawEl) {
    initialRaw = htmlToPlainText(typeof rawEl.value === "string" ? rawEl.value : (rawEl.textContent || ""));
  }

  let currentBlockText = initialRaw.trim();
  let editingFloorIdx = -1;
  let isWriting = false;

  function parseFloors(blockText) {
    const lines = String(blockText || "").split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    const floors = [];
    const tagRe = /^※\s*([^：\r\n:]{1,12})[：:]\s*(.*)$/;
    lines.forEach(function (line) {
      if (line.indexOf("※") === 0) {
        const m = line.match(tagRe);
        if (m) {
          const rawCand = m[1].trim();
          const hasPunct = /[，。！？；、“”‘’「」『』()（）]/.test(rawCand);
          const cleanTag = (!hasPunct && !/^\d+$/.test(rawCand)) ? sanitizeTag(rawCand) : "";
          const bodyText = m[2].trim();
          if (cleanTag && bodyText) {
            floors.push({ tag: cleanTag, text: bodyText });
            return;
          }
        }
        floors.push({ tag: "", text: line.replace(/^※\s*/, "").trim() });
      } else if (floors.length > 0) {
        floors[floors.length - 1].text += "\n" + line;
      } else {
        floors.push({ tag: "", text: line });
      }
    });
    return floors;
  }

  function serializeFloors(floors) {
    return floors.map(function (f) {
      const cleanTag = sanitizeTag(f.tag);
      const cleanBody = String(f.text || "").replace(/\r?\n+/g, " ").trim();
      return cleanTag ? ("※ " + cleanTag + "：" + cleanBody) : ("※ " + cleanBody);
    }).join("\n");
  }

  function resolveTavernAdapter() {
    const hw = getHostWin();
    const th = window.TavernHelper || (hw && hw.TavernHelper) || null;
    const getChatMessages = window.getChatMessages || (th && th.getChatMessages) || (hw && hw.getChatMessages) || null;
    const setChatMessages = window.setChatMessages || (th && th.setChatMessages) || (hw && hw.setChatMessages) || null;
    const getCurrentMessageId = window.getCurrentMessageId || (th && th.getCurrentMessageId) || (hw && hw.getCurrentMessageId) || null;
    if (!getChatMessages || !setChatMessages) return null;
    return { getChatMessages: getChatMessages, setChatMessages: setChatMessages, getCurrentMessageId: getCurrentMessageId };
  }

  function detectMessageContext() {
    let mesId = null;
    let blockIdx = 0;
    const adapter = resolveTavernAdapter();
    try {
      if (adapter && adapter.getCurrentMessageId) {
        const cid = adapter.getCurrentMessageId();
        if (typeof cid === "number" && cid >= 0) mesId = cid;
        else if (typeof cid === "string" && /^\d+$/.test(cid)) mesId = Number(cid);
      }
    } catch (e) {}

    try {
      if (window.frameElement) {
        const mesEl = window.frameElement.closest("[mesid]");
        if (mesEl) {
          if (mesId === null) {
            const rawAttr = mesEl.getAttribute("mesid");
            if (rawAttr !== null && /^\d+$/.test(rawAttr)) mesId = Number(rawAttr);
          }
          const frames = Array.prototype.slice.call(mesEl.querySelectorAll("iframe"));
          let commentCount = 0;
          for (let i = 0; i < frames.length; i++) {
            const fr = frames[i];
            if (fr === window.frameElement) {
              blockIdx = commentCount;
              break;
            }
            let isCommentCard = false;
            let isDeletedCard = false;
            try {
              if (fr.contentDocument) {
                if (fr.contentDocument.querySelector('[data-yd-card="comment-deleted"]')) {
                  isDeletedCard = true;
                } else if (fr.contentDocument.querySelector('[data-yd-card="comment"]')) {
                  isCommentCard = true;
                }
              }
            } catch (e) {}
            if (!isCommentCard && !isDeletedCard) {
              try {
                const rawDoc = fr.getAttribute("srcdoc") || fr.srcdoc || "";
                if (rawDoc.indexOf('data-yd-card="comment"') !== -1) {
                  isCommentCard = true;
                }
              } catch (e) {}
            }
            if (isCommentCard) {
              commentCount++;
            }
          }
        }
      }
    } catch (e) {}

    return { mesId: mesId, blockIdx: blockIdx, adapter: adapter };
  }

  function maskThinkBlocks(text) {
    return text.replace(/<(draft|summary|recap)(?=[\s>])[^>]*>[\s\S]*?<\/\1>/gi, function (m) {
      return m.replace(/[^\r\n]/g, " ");
    });
  }

  function findCommentBlocksInMessage(msgText) {
    const masked = maskThinkBlocks(msgText);
    const re = /(?:^|\n)([ \t]*※[ \t]*[^\r\n]+(?:\r?\n[ \t]*※[ \t]*[^\r\n]+)*)(?=[ \t]*(?:\r?\n|$))/g;
    const ranges = [];
    let match;
    while ((match = re.exec(masked)) !== null) {
      const fullStart = match.index + (match[0].startsWith("\n") ? 1 : 0);
      const blockStr = match[1];
      ranges.push({ start: fullStart, end: fullStart + blockStr.length, raw: msgText.slice(fullStart, fullStart + blockStr.length) });
    }
    return ranges;
  }

  function resolveTargetCommentRange(ranges, blockIdx, wantedText) {
    const direct = ranges[blockIdx] || null;
    const wanted = String(wantedText || "").trim();
    if (direct && direct.raw.trim() === wanted) {
      return direct;
    }
    const matches = ranges.filter(function (item) {
      return item.raw.trim() === wanted;
    });
    if (matches.length === 1) {
      return matches[0];
    }
    if (matches.length > 1) {
      throw new Error("存在多个相同批注块且索引失配，请刷新消息后重试");
    }
    throw new Error("未能定位当前批注串在消息中的位置");
  }

  function setControlsDisabled(disabled) {
    if (replyBtn) replyBtn.disabled = disabled;
    if (replyInput) replyInput.disabled = disabled;
    if (tagInput) tagInput.disabled = disabled;
    if (tagRowEl) {
      const chips = tagRowEl.querySelectorAll(".yd-tag-chip");
      for (let i = 0; i < chips.length; i++) chips[i].disabled = disabled;
    }
  }

  async function persistBlockUpdate(nextBlockText, okMsg, onSuccess) {
    const hw = getHostWin();
    if (isWriting || (hw && hw.__YD_COMMENT_WRITE_LOCK__)) return false;
    isWriting = true;
    if (hw) hw.__YD_COMMENT_WRITE_LOCK__ = true;
    setControlsDisabled(true);

    try {
      const ctx = detectMessageContext();
      if (!ctx.adapter || ctx.mesId === null) {
        currentBlockText = nextBlockText;
        editingFloorIdx = -1;
        if (onSuccess) onSuccess();
        render();
        showToast(okMsg + "（离线沙盒模式：仅本地暂存）");
        return true;
      }

      const list = await ctx.adapter.getChatMessages(ctx.mesId);
      const msgObj = Array.isArray(list) ? list[0] : null;
      if (!msgObj || typeof msgObj.message !== "string") {
        throw new Error("未读取到当前消息正文");
      }

      const ranges = findCommentBlocksInMessage(msgObj.message);
      const targetRange = resolveTargetCommentRange(ranges, ctx.blockIdx, currentBlockText);

      const before = msgObj.message.slice(0, targetRange.start);
      const after = msgObj.message.slice(targetRange.end);
      let updatedMsg = before + nextBlockText + after;
      if (!nextBlockText) {
        updatedMsg = before.replace(/(?:\r?\n){2,}$/, "\n") + after.replace(/^(?:\r?\n){2,}/, "\n");
      }

      await ctx.adapter.setChatMessages([{ message_id: ctx.mesId, message: updatedMsg }], { refresh: "none" });
      currentBlockText = nextBlockText;
      editingFloorIdx = -1;
      if (onSuccess) onSuccess();
      render();
      showToast(okMsg);
      return true;
    } catch (err) {
      showToast("⚠️ 写回失败：" + (err && err.message ? err.message : String(err)));
      return false;
    } finally {
      isWriting = false;
      if (hw) hw.__YD_COMMENT_WRITE_LOCK__ = false;
      setControlsDisabled(false);
    }
  }

  function render() {
    const floors = parseFloors(currentBlockText);
    const isDeleted = !currentBlockText || floors.length === 0;
    if (cardEl) {
      cardEl.setAttribute("data-yd-card", isDeleted ? "comment-deleted" : "comment");
      cardEl.classList.toggle("is-empty", isDeleted);
    }
    if (countEl) countEl.textContent = isDeleted ? "已清空" : (floors.length + " 楼");
    if (previewEl) {
      previewEl.textContent = isDeleted
        ? "该批注串已清空"
        : (floors[0].tag ? (floors[0].tag + "：" + floors[0].text) : floors[0].text);
    }

    listEl.innerHTML = "";
    if (isDeleted) {
      const note = document.createElement("div");
      note.className = "yd-empty-note";
      note.textContent = "该批注串已清空，刷新消息后自动移除";
      listEl.appendChild(note);
      notifyFrameResize();
      return;
    }

    floors.forEach(function (floor, idx) {
      const row = document.createElement("div");
      row.className = "yd-floor";

      const meta = document.createElement("div");
      meta.className = "yd-floor-meta";

      const badge = document.createElement("span");
      badge.className = "yd-badge";
      badge.textContent = floor.tag || "批注";
      meta.appendChild(badge);

      const num = document.createElement("span");
      num.className = "yd-floor-num";
      num.textContent = "#" + (idx + 1);
      meta.appendChild(num);

      const actions = document.createElement("div");
      actions.className = "yd-floor-actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "yd-mini-btn";
      editBtn.textContent = "编辑";
      editBtn.addEventListener("click", function () {
        editingFloorIdx = editingFloorIdx === idx ? -1 : idx;
        render();
      });
      actions.appendChild(editBtn);

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "yd-mini-btn is-danger";
      delBtn.textContent = "删除";
      delBtn.addEventListener("click", function () {
        const nextFloors = floors.filter(function (_, j) { return j !== idx; });
        persistBlockUpdate(serializeFloors(nextFloors), "🗑️ 已删除该条记录");
      });
      actions.appendChild(delBtn);

      meta.appendChild(actions);
      row.appendChild(meta);

      if (editingFloorIdx === idx) {
        const editBox = document.createElement("div");
        editBox.className = "yd-edit-box";

        const editTagRow = document.createElement("div");
        editTagRow.className = "yd-edit-tag-row";

        const editTagLabel = document.createElement("span");
        editTagLabel.className = "yd-tag-label";
        editTagLabel.textContent = "标签";
        editTagRow.appendChild(editTagLabel);

        const initialTag = floor.tag || "";
        QUICK_TAGS.forEach(function (qt) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "yd-tag-chip" + (initialTag === qt ? " is-active" : "");
          chip.setAttribute("data-yd-tag", qt);
          chip.textContent = qt;
          editTagRow.appendChild(chip);
        });

        const editTagInput = document.createElement("input");
        editTagInput.type = "text";
        editTagInput.className = "yd-tag-input";
        editTagInput.maxLength = 12;
        editTagInput.value = initialTag;
        editTagInput.placeholder = "可留空或自填";
        editTagRow.appendChild(editTagInput);
        bindTagSelector(editTagRow, editTagInput);
        editBox.appendChild(editTagRow);

        const editInput = document.createElement("textarea");
        editInput.className = "yd-edit-input";
        editInput.value = floor.text;
        editInput.placeholder = "修改批注内容（回车保存，Esc 取消）";
        editBox.appendChild(editInput);

        function saveEditedFloor() {
          const val = editInput.value.trim();
          if (!val) {
            showToast("⚠️ 批注内容不能为空，如需移除请点删除");
            return;
          }
          const nextTag = sanitizeTag(editTagInput.value);
          const nextFloors = floors.map(function (item, j) {
            return j === idx ? { tag: nextTag, text: val } : item;
          });
          persistBlockUpdate(serializeFloors(nextFloors), "✅ 已保存修改");
        }

        function handleEditKeydown(ev) {
          if (ev.isComposing) return;
          if (ev.key === "Enter" && !ev.shiftKey) {
            ev.preventDefault();
            saveEditedFloor();
          } else if (ev.key === "Escape") {
            ev.preventDefault();
            editingFloorIdx = -1;
            render();
          }
        }
        editTagInput.addEventListener("keydown", handleEditKeydown);
        editInput.addEventListener("keydown", handleEditKeydown);

        const editBar = document.createElement("div");
        editBar.className = "yd-edit-bar";

        const saveBtn = document.createElement("button");
        saveBtn.type = "button";
        saveBtn.className = "yd-mini-btn";
        saveBtn.textContent = "保存";
        saveBtn.addEventListener("click", saveEditedFloor);
        editBar.appendChild(saveBtn);

        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "yd-mini-btn";
        cancelBtn.textContent = "取消";
        cancelBtn.addEventListener("click", function () {
          editingFloorIdx = -1;
          render();
        });
        editBar.appendChild(cancelBtn);

        editBox.appendChild(editBar);
        row.appendChild(editBox);
      } else {
        const textEl = document.createElement("div");
        textEl.className = "yd-floor-text";
        textEl.textContent = floor.text;
        row.appendChild(textEl);
      }

      listEl.appendChild(row);
    });

    notifyFrameResize();
  }

  function handleAppend() {
    if (!currentBlockText) {
      showToast("⚠️ 该批注串已清空，请刷新消息后再试");
      return;
    }
    const val = replyInput ? replyInput.value.replace(/\r?\n+/g, " ").trim() : "";
    if (!val) {
      showToast("⚠️ 请输入批注内容后再添加");
      return;
    }
    const chosenTag = sanitizeTag(tagInput ? tagInput.value : "") || "点评";
    const floors = parseFloors(currentBlockText);
    floors.push({ tag: chosenTag, text: val });
    persistBlockUpdate(serializeFloors(floors), "💬 已添加「" + chosenTag + "」", function () {
      if (replyInput) replyInput.value = "";
    });
  }

  bindTagSelector(tagRowEl, tagInput);

  if (replyBtn) {
    replyBtn.addEventListener("click", handleAppend);
  }
  if (replyInput) {
    replyInput.addEventListener("keydown", function (e) {
      if (e.isComposing) return;
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleAppend();
      }
    });
  }

  function toggleCollapse() {
    if (!cardEl || !collapseBtn) return;
    const collapsed = cardEl.classList.toggle("is-collapsed");
    collapseBtn.textContent = collapsed ? "▸" : "▾";
    collapseBtn.setAttribute("aria-expanded", String(!collapsed));
    notifyFrameResize();
  }

  if (collapseBtn && cardEl) {
    collapseBtn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      toggleCollapse();
    });
  }
  if (headEl && cardEl) {
    headEl.addEventListener("click", toggleCollapse);
  }

  render();

  if (typeof ResizeObserver !== "undefined" && (cardEl || document.body)) {
    new ResizeObserver(notifyFrameResize).observe(cardEl || document.body);
  }
})();
</script>
</body>
</html>
